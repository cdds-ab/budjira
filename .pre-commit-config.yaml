# Pre-commit hooks configuration
# See https://pre-commit.com for more information
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter (replaces black, flake8, isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi]

  # MyPy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - pydantic>=2.0.0
        args: [--strict, --ignore-missing-imports]

  # Bandit - Security vulnerability scanner
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

  # Commitizen - Enforce conventional commits
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Pytest with coverage - Run tests with minimum coverage requirement
  - repo: local
    hooks:
      - id: pytest-cov
        name: pytest with coverage
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        args:
          - --cov=budjira
          - --cov-fail-under=70
          - --cov-report=term-missing:skip-covered
          - -q

      # AI prompt freshness check - Remind to update AI documentation
      - id: check-ai-prompt-freshness
        name: check AI prompt documentation freshness
        entry: python scripts/check_ai_prompt.py
        language: system
        pass_filenames: false
        files: ^(budjira/cli/.*\.py|budjira/models/.*\.py)$

      # Documentation update reminders - Remind about doc updates based on changes
      - id: check-documentation-updates
        name: documentation update reminders
        entry: python scripts/check_documentation_updates.py
        language: system
        pass_filenames: false
        always_run: true

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^\.claude/ai-usage-prompt\.md$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: detect-private-key
