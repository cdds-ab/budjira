[project]
name = "budjira"
version = "1.22.0"
description = "A CLI buddy for Jira - efficient command-line interaction with Jira Cloud"
authors = [
    {name = "cdds-ab", email = "info@cdds.de"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["jira", "cli", "project-management", "atlassian", "issue-tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Utilities",
    "Environment :: Console",
]

dependencies = [
    "jira>=3.8.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "xdg-base-dirs>=6.0.0",
    "shellingham>=1.5.0",  # For typer shell completion
    "tomli-w>=1.0.0",  # For writing TOML files
    "tomli>=2.0.0;python_version<'3.11'",  # For reading TOML on Python <3.11
    "requests>=2.31.0",  # For GitHub API and HTTP requests
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "bandit>=1.8.0",
    "commitizen>=4.9.1",
    "pre-commit>=4.0.1",
    "radon>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/cdds-ab/budjira"
Documentation = "https://github.com/cdds-ab/budjira#readme"
Repository = "https://github.com/cdds-ab/budjira"
Issues = "https://github.com/cdds-ab/budjira/issues"
Changelog = "https://github.com/cdds-ab/budjira/releases"

[project.scripts]
budjira = "budjira.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["budjira"]

# Ruff configuration
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["budjira", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (Typer uses this)
    "SIM117", # nested with statements - acceptable in tests for clarity
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",    # unused arguments are common in tests
    "S101",   # assert statements are OK in tests
]
"budjira/utils/banner.py" = [
    "RUF001",  # Unicode box-drawing chars are intentional for ASCII art
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# MyPy configuration
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "jira.*",
    "xdg_base_dirs.*",
    "tomli",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
# Pydantic models accept strings for HttpUrl and Path fields
warn_return_any = false

[[tool.mypy.overrides]]
module = "budjira.cli.*"
# Typer decorators are untyped
disallow_untyped_decorators = false

# Pytest configuration
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--cov=budjira",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]

[tool.coverage.run]
source = ["budjira"]
omit = [
    "tests/*",
    "budjira/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

# Bandit configuration
[tool.bandit]
exclude_dirs = ["tests", ".venv", "scripts"]
skips = ["B101"]  # assert_used - we use asserts in tests

# Commitizen configuration
[tool.commitizen]
name = "cz_conventional_commits"
version = "1.22.0"
version_files = [
    "pyproject.toml:version",
    "budjira/__init__.py:__version__",
]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
# Annotated tags are required: `git push --follow-tags` only pushes annotated
# tags, so lightweight tags silently never reach the remote and the release
# workflow (which triggers on v* tag pushes) never runs.
annotated_tag = true

[dependency-groups]
dev = [
    "types-requests>=2.32.4.20250913",
]
